name: mirror releases

on:
  schedule:
    - cron: "17 */3 * * *"   # каждые 3 часа
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Проверить и опубликовать новые сборки
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror.py
