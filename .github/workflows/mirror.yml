name: mirror releases

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (пустой прогон ~20 с; публичный репозиторий — минуты бесплатны)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Проверить и опубликовать новые сборки
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/mirror.py
